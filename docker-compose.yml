  services:
    mongo:
      image: mongo:7
      command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
      ports:
        - "27017:27017"
      volumes:
        - mongo-data:/data/db
      healthcheck:
        test: >
          echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" |
          mongosh --port 27017 --quiet
        interval: 5s
        timeout: 30s
        retries: 30

    redis:
      image: redis:7-alpine
      ports:
        - "6379:6379"
      volumes:
        - redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 10

  volumes:
    mongo-data:
    redis-data: